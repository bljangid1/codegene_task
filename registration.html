<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/additional-methods.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/AlertifyJS/1.13.1/alertify.js" integrity="sha512-eOUPKZXJTfgptSYQqVilRmxUNYm0XVHwcRHD4mdtCLWf/fC9XWe98IT8H1xzBkLL4Mo9GL0xWMSJtgS5te9rQA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>



// $("#submitForm").submit(function(e){
// 	alert("Submitted");
// })
$("#submitForm").validate({
    rules: {
        txtname: {
            required: true
        },

        txtemail: {
            required: true,
            email: true,
            pattern: /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/
        },

        txtphone: {
            required: true,
            digits: true,
            minlength: 10,
            maxlength: 10,
            // pattern: /^[6-9]\d{9}$/
        },

        txtpassword: {
            required: true,
            minlength: 8,
			// pattern: /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/

        }
    },

    messages: {
        txtname: {
            required: "Full name is required",
        },

        txtemail: {
            required: "Email is required",
            email: "Please enter a valid email address",
            pattern: "Email format should be like example@gmail.com",
        },

        txtphone: {
            required: "Mobile number is required",
            digits: "Only numbers are allowed",
            minlength: "Mobile number must be 10 digits",
            maxlength: "Mobile number must be 10 digits",
            // pattern: "Enter a valid 10-digit mobile number",
        },

        txtpassword: {
            required: "Password is required",
            minlength: "Password must be at least 8 characters",
			// pattern: "Password must contain uppercase, lowercase, number, and special character",
        }
    },
    submitHandler: function(e){

        let data = {
            "Name": $("#txtname").val(),
            "Email": $("#txtemail").val(),
            "Phone":$("#txtphone").val(),
            "Password":$("#txtpassword").val(),
            "Flag":"Submit-Form",
        }

        let jsonData = JSON.stringify(data);

        $.ajax({
            url: "api/operations.php",
            type:"POST",
            data:jsonData,
            dataType:"JSON",
            contentType:"application/json; charset=utf-8",

            success: function (response) {
                            if (response.status === "success") {
                                  alertify.success(response.message);
                                  setTimeout(() => {
                                      window.location.href="login.php";
                                  }, 2000);

                            }
                            else{
                                alertify.error(response.message);
                            }
                        }

        })

    }
	
});

 </script>
